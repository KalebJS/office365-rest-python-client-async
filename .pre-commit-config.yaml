repos:
- hooks:
  - entry: uv run pyproject-fmt pyproject.toml
    id: pyproject-fmt
    language: system
    name: pyproject-fmt
    pass_filenames: false
  - entry: uv lock
    id: uv-lock
    language: system
    name: uv lock
    pass_filenames: false
  - entry: uv run ruff check --fix --exit-non-zero-on-fix
    id: ruff-check
    language: system
    name: ruff-check
    pass_filenames: false
  - entry: uv run black .
    id: black
    language: system
    name: black
    pass_filenames: false
  - entry: uv run pylint office365
    id: pylint
    language: system
    name: pylint
    pass_filenames: false
  repo: local
- hooks:
  - id: commitizen
  - id: commitizen-branch
    stages:
    - pre-push
  repo: https://github.com/commitizen-tools/commitizen
  rev: v4.13.9
